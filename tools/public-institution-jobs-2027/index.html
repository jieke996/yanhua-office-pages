<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027 内蒙古事业单位筛岗系统 · 言华教育</title>
  <link rel="stylesheet" href="styles.css?v=20260910-v8">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">2027 内蒙古事业单位</p>
        <h1>内蒙古事业单位筛岗系统</h1>
        <p class="subtitle">输入学历、专业、岗位属性等条件，快速筛选可能可报的岗位。结果仅作初筛，最终以公告要求为准。</p>
      </div>
      <div class="stats-card">
        <span>岗位库</span>
        <strong id="totalCount">-</strong>
      </div>
    </header>

    <section class="filter-panel">
      <div class="filter-row filter-row--fields">
        <label>
          <span>学历</span>
          <select id="education">
            <option value="">全部</option>
          </select>
        </label>
        <label>
          <span>学位</span>
          <select id="degree">
            <option value="">全部</option>
          </select>
        </label>
        <label class="major-field">
          <span>专业名称</span>
          <input id="major" type="text" placeholder="例如：计算机科学与技术" autocomplete="off">
          <ul class="major-suggest" id="majorSuggest" hidden></ul>
        </label>
        <label>
          <span>岗位属性</span>
          <select id="jobAttribute">
            <option value="">全部</option>
          </select>
        </label>
        <label>
          <span>地区关键词</span>
          <input id="region" type="text" placeholder="例如：通辽、科尔沁">
        </label>
      </div>
      <div class="filter-row filter-row--sub">
        <label>
          <span>政治面貌</span>
          <select id="politic">
            <option value="">全部</option>
          </select>
        </label>
        <label>
          <span>性别</span>
          <select id="gender">
            <option value="">全部</option>
          </select>
        </label>
        <label>
          <span>分类笔试</span>
          <select id="exam">
            <option value="">全部</option>
          </select>
        </label>
        <div class="check-row-group">
          <label class="check-row">
            <input id="allRegion" type="checkbox" checked>
            <span>全部内蒙古</span>
          </label>
          <label class="check-row">
            <input id="includeUnlimitedMajor" type="checkbox" checked>
            <span>包含不限专业</span>
          </label>
        </div>
        <div class="actions">
          <button class="primary" id="searchBtn" type="button">查询岗位</button>
          <button class="ghost" id="resetBtn" type="button">清空</button>
        </div>
      </div>
    </section>

    <section class="district-filter" id="districtFilter" aria-label="内蒙古地区筛选">
      <div class="district-row district-row--nav" id="districtNav">
        <span class="district-label">地区筛选</span>
        <div class="district-row__chips" id="districtNavChips"></div>
      </div>
      <div class="district-row district-row--sub" id="districtSubPanel" hidden>
        <span class="district-sub-label" id="districtSubLabel">通辽市</span>
        <div class="district-row__chips" id="districtSubChips"></div>
      </div>
    </section>

    <section class="result-toolbar">
      <div>
        <strong id="resultCount">0</strong>
        <span>个匹配岗位</span>
      </div>
      <div class="toolbar-actions">
        <button class="primary compact" id="unitListBtn" type="button" disabled>📋 招录单位</button>
        <button class="primary compact" id="exportBtn" type="button" disabled>📥 导出 Excel</button>
        <p id="queryHint">当前查询范围：全部内蒙古</p>
      </div>
    </section>

    <section class="result-list" id="resultList">
      <div class="empty">正在加载全部岗位...</div>
    </section>
  </main>

  <div class="modal-backdrop" id="unitModal" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="unitModalTitle">
      <div class="modal-header">
        <div>
          <h2 id="unitModalTitle">招录单位</h2>
          <p id="unitModalCount">当前查询结果 0 个单位</p>
        </div>
        <button class="ghost compact" id="unitModalClose" type="button">关闭</button>
      </div>
      <div class="modal-body">
        <table class="unit-table">
          <thead>
            <tr>
              <th>序号</th>
              <th>单位名称</th>
            </tr>
          </thead>
          <tbody id="unitTableBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="xlsx.full.min.js"></script>
  <script src="data.js?v=20260910-v8"></script>
  <script src="app.js?v=20260910-v8"></script>
  <script>
    // 兜底错误显示：init() 抛错时让用户看到具体错误，而不是卡在"正在加载"
    window.addEventListener('error', (e) => {
      const result = document.getElementById('resultList');
      if (result && result.querySelector('.empty') && result.textContent.includes('正在加载')) {
        result.innerHTML = `<div class="empty" style="color:#c0392b;text-align:left;padding:20px;">
          <strong>⚠️ 页面加载出错</strong><br>
          ${(e.error?.message || e.message || '未知错误').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}<br>
          <small style="color:#888;">请按 <kbd>Cmd+Shift+R</kbd> (macOS) / <kbd>Ctrl+Shift+R</kbd> (Windows) 硬刷新清除缓存</small>
        </div>`;
      }
    });
  </script>
</body>
</html>
