<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>专业类别查询系统</title>
    <style>
        :root {
            --primary-color: #1677FF;
            --primary-hover: #0958D9;
            --bg-color: #f5f7fa;
            --text-color: #333;
            --border-color: #dcdfe6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
            padding: 24px 20px;
            color: var(--text-color);
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            background: #fff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { font-size: 22px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .header p { color: #999; font-size: 13px; }

        .filter-form {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 20px;
            margin-bottom: 14px;
        }

        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 6px; font-size: 13px; color: #606266; font-weight: 500; }
        .form-group label.required::before { content: '*'; color: #f56c6c; margin-right: 4px; }

        .form-group input,
        .form-group select {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            background: #fff;
            height: 42px;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.1);
        }
        .form-group input::placeholder { color: #c0c4cc; }

        .degree-chips {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 18px;
            flex-wrap: wrap;
            min-height: 26px;
        }
        .degree-chips .tip { font-size: 12px; color: #a0a4ab; }
        .chip {
            padding: 4px 12px;
            border-radius: 14px;
            border: 1px solid #e4e7ed;
            background: #fff;
            color: #606266;
            font-size: 12px;
            cursor: pointer;
            transition: all .2s;
        }
        .chip:hover { border-color: #b3d0ff; color: var(--primary-color); }
        .chip.active {
            background: rgba(22, 119, 255, .08);
            border-color: var(--primary-color);
            color: var(--primary-color);
            font-weight: 500;
        }

        .actions { display: flex; gap: 12px; margin-bottom: 22px; }

        .btn {
            padding: 11px 30px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-query { background: var(--primary-color); color: #fff; box-shadow: 0 4px 12px rgba(22, 119, 255, 0.3); }
        .btn-query:hover { background: var(--primary-hover); }
        .btn-query:disabled { opacity: .6; cursor: not-allowed; }
        .btn-clear { background: #fff; color: #606266; border: 1px solid var(--border-color); }
        .btn-clear:hover { border-color: var(--primary-color); color: var(--primary-color); }

        .loading { display: none; text-align: center; padding: 20px; color: #909399; font-size: 14px; }
        .loading.show { display: block; }
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid #e4e7ed;
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            vertical-align: -2px;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result-section { display: none; }
        .result-section.show { display: block; }
        .result-title { font-size: 14px; font-weight: 500; color: #303133; margin-bottom: 12px; }
        .result-count { color: #909399; font-weight: 400; font-size: 13px; }

        .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #ebeef5; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: var(--primary-color); }
        th { color: #fff; padding: 12px 14px; text-align: center; font-weight: 500; font-size: 13px; white-space: nowrap; }
        td { padding: 12px 14px; text-align: center; border-bottom: 1px solid #f0f0f0; color: #606266; font-size: 13px; }
        td:last-child { white-space: nowrap; }
        tbody tr:hover { background: #f5f9ff; }
        tbody tr:last-child td { border-bottom: none; }
        .td-name { color: #303133; font-weight: 500; }
        .name-wrap { display: inline-block; max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
        .td-note { display: block; font-size: 11px; color: #b0b3b8; font-weight: 400; margin-top: 2px; }
        .code { font-family: "SF Mono", Menlo, Consolas, monospace; color: #909399; font-size: 12px; }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 500; white-space: nowrap; }
        .badge-本科 { background: #e6f0ff; color: #1677FF; }
        .badge-专科 { background: #fef3e2; color: #f5a623; }
        .badge-职业本科 { background: #e8f7ee; color: #23a865; }
        .badge-研究生 { background: #f0f4ff; color: #5b6abf; }
        .badge-pro { background: #fdf0f5; color: #d4537e; margin-left: 4px; }

        .no-data { text-align: center; padding: 34px 20px; color: #c0c4cc; }
        .no-data p { font-size: 14px; }
        .suggest { margin-top: 14px; }
        .suggest .suggest-tip { font-size: 12px; color: #a0a4ab; margin-bottom: 10px; }
        .suggest .suggest-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .suggest button {
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid #e4e7ed;
            background: #fff;
            color: #606266;
            font-size: 13px;
            cursor: pointer;
        }
        .suggest button:hover { border-color: var(--primary-color); color: var(--primary-color); }

        .disclaimer {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px dashed #ebeef5;
            font-size: 12px;
            color: #b0b3b8;
            line-height: 1.8;
        }
        .disclaimer b { color: #909399; font-weight: 500; }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .container { padding: 20px 16px; }
            .filter-form { grid-template-columns: 1fr; gap: 14px; }
            .actions .btn { flex: 1; }
            th, td { padding: 10px 8px; font-size: 12px; }
            .col-men, .col-class { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 专业类别查询系统</h1>
            <p>输入专业名称或专业代码，查询对应的专业类与学科门类（专科 / 职业本科 / 本科 / 研究生）</p>
        </div>

        <div class="filter-form">
            <div class="form-group">
                <label>学历层次</label>
                <select id="degree">
                    <option value="全部">全部</option>
                    <option value="专科">专科</option>
                    <option value="职业本科">职业本科</option>
                    <option value="本科">本科</option>
                    <option value="研究生">研究生</option>
                </select>
            </div>
            <div class="form-group">
                <label class="required">专业名称 / 代码</label>
                <input type="text" id="majorInput" placeholder="例如：美术与书法、书法学、1356、会计学">
            </div>
        </div>

        <div class="degree-chips" id="degreeChips"></div>

        <div class="actions">
            <button class="btn btn-clear" onclick="clearForm()">清空</button>
            <button class="btn btn-query" id="queryBtn" onclick="search()">查询</button>
        </div>

        <div class="loading" id="loading"><span class="spinner"></span>查询中...</div>

        <div class="result-section" id="resultSection">
            <div class="result-title">查询结果 <span class="result-count" id="resultCount"></span></div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>专业名称</th>
                            <th>专业代码</th>
                            <th class="col-class">专业类</th>
                            <th class="col-men">学科门类</th>
                            <th>层次</th>
                        </tr>
                    </thead>
                    <tbody id="resultBody"></tbody>
                </table>
            </div>
        </div>

        <div class="disclaimer" id="disclaimer">
            说明：本工具数据取自教育部《普通高等学校本科专业目录（2026年）》《研究生教育学科专业目录（2022年）》《各专业学位类别的领域设置情况（2021年）》及《职业教育专业目录（2021年）》，共 <b id="totalCount">-</b> 条，供参考；实际报考以招聘公告与主管部门解释为准。
        </div>
    </div>

    <script>
        let items = [];
        let loaded = false;
        let degreeType = '全部';

        const majorInput = document.getElementById('majorInput');
        const degreeSelect = document.getElementById('degree');
        const queryBtn = document.getElementById('queryBtn');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('resultSection');
        const resultBody = document.getElementById('resultBody');
        const resultCount = document.getElementById('resultCount');
        const degreeChips = document.getElementById('degreeChips');

        // ---------- 数据加载：把树形结构摊平成检索索引 ----------
        async function loadData() {
            if (loaded) return;
            const res = await fetch('majors.json?v=20261020');
            const raw = await res.json();
            const data = raw.data || raw;
            items = [];

            for (const [level, menList] of Object.entries(data)) {
                (menList || []).forEach(men => {
                    (men.classes || []).forEach(cls => {
                        (cls.majors || []).forEach(mj => {
                            items.push({
                                name: mj.name,
                                code: String(mj.code || ''),
                                alias: mj.alias || [],
                                note: mj.note || '',
                                parent: mj.parent || '',
                                className: cls.name,
                                classCode: cls.code,
                                menName: men.name,
                                degreeType: cls.degreeType || '',
                                level
                            });
                        });
                    });
                });
            }
            loaded = true;
            document.getElementById('totalCount').textContent = items.length.toLocaleString();
            console.log('专业数据加载完成:', items.length, '条');
        }

        // ---------- 学位类型筛选（只有研究生区分学术/专业学位）----------
        function renderChips() {
            const level = degreeSelect.value;
            degreeType = '全部';
            if (level !== '研究生') {
                degreeChips.innerHTML = '';
                degreeChips.style.display = 'none';
                return;
            }
            degreeChips.style.display = 'flex';
            degreeChips.innerHTML = '<span class="tip">学位类型：</span>' +
                ['全部', '学术学位', '专业学位']
                    .map(t => `<button class="chip${t === '全部' ? ' active' : ''}" data-type="${t}">${t}</button>`)
                    .join('');
            degreeChips.querySelectorAll('.chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    degreeChips.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    degreeType = btn.dataset.type;
                });
            });
        }

        function norm(s) {
            return String(s || '').replace(/[\s\u3000·・,，。;；:：\-—_/（）()]/g, '');
        }

        majorInput.addEventListener('keypress', e => { if (e.key === 'Enter') search(); });
        degreeSelect.addEventListener('change', renderChips);

        async function search() {
            const kw = majorInput.value.trim();
            const level = degreeSelect.value;

            if (!kw) {
                majorInput.focus();
                majorInput.style.borderColor = '#f56c6c';
                setTimeout(() => { majorInput.style.borderColor = ''; }, 1800);
                return;
            }

            loading.classList.add('show');
            resultSection.classList.remove('show');
            queryBtn.disabled = true;

            try {
                if (!loaded) await loadData();
            } catch (e) {
                loading.classList.remove('show');
                queryBtn.disabled = false;
                resultBody.innerHTML = '<tr><td colspan="5"><div class="no-data"><p>数据加载失败，请刷新页面重试</p></div></td></tr>';
                resultSection.classList.add('show');
                return;
            }

            const key = norm(kw);
            const isCode = /^\d{2,7}/.test(kw.replace(/\s/g, ''));

            let hits = items.filter(it => {
                if (level !== '全部' && it.level !== level) return false;
                if (degreeType !== '全部' && it.degreeType !== degreeType) return false;
                if (isCode) return it.code.startsWith(kw.trim());
                const hay = [it.name, it.parent, ...(it.alias || [])].map(norm);
                return hay.some(h => h.includes(key));
            });

            // 相关度：完全同名 > 名称前缀 > 名称包含 > 别名命中 > 父级/备注命中
            const rel = (it, k) => {
                const n = norm(it.name);
                if (n === k) return 100;
                if (n.startsWith(k)) return 90 - n.length * 0.1;
                if (n.includes(k)) return 80 - n.length * 0.1;
                if ((it.alias || []).some(a => norm(a).includes(k))) return 60 - n.length * 0.1;
                return 40 - n.length * 0.1;
            };
            hits.sort((a, b) => {
                const d = rel(b, key) - rel(a, key);
                if (d !== 0) return d;
                if (a.name.length !== b.name.length) return a.name.length - b.name.length;
                return a.code.localeCompare(b.code);
            });

            resultBody.innerHTML = '';
            if (hits.length) {
                resultCount.textContent = `（共 ${hits.length} 条）`;
                const frag = document.createDocumentFragment();
                hits.forEach(it => {
                    const tr = document.createElement('tr');
                    const degreeLabel = it.level === '研究生' && it.degreeType
                        ? `<span class="badge badge-研究生">研究生</span><span class="badge badge-pro">${it.degreeType}</span>`
                        : `<span class="badge badge-${it.level}">${it.level}</span>`;
                    const classCell = (it.className === it.name || !it.className)
                        ? '<span style="color:#c8cbd0">—</span>'
                        : ((it.parent && it.parent !== it.className)
                            ? `${it.className}<span class="td-note">${it.parent}</span>`
                            : it.className);
                    tr.innerHTML = `
                        <td class="td-name"><span class="name-wrap" title="${it.name}">${hl(it.name, kw)}</span>${it.note ? `<span class="td-note">${it.note}</span>` : ''}</td>
                        <td><span class="code">${it.code}</span></td>
                        <td class="col-class">${classCell}</td>
                        <td class="col-men">${it.menName}</td>
                        <td>${degreeLabel}</td>`;
                    frag.appendChild(tr);
                });
                resultBody.appendChild(frag);
            } else {
                const sug = suggest(key, level, degreeType);
                const sugHtml = sug.length
                    ? `<div class="suggest"><div class="suggest-tip">没有精确命中，是不是想查：</div>
                       <div class="suggest-list">${sug.map(s => `<button onclick="quickSearch('${s.replace(/'/g, '&#39;')}')">${s}</button>`).join('')}</div></div>`
                    : '<p style="font-size:12px;margin-top:6px;">请检查输入，或换成专业全称再试</p>';
                resultCount.textContent = '';
                resultBody.innerHTML = `<tr><td colspan="5"><div class="no-data">
                    <p>未找到与「${kw}」相关的专业</p>${sugHtml}</div></td></tr>`;
            }

            resultSection.classList.add('show');
            loading.classList.remove('show');
            queryBtn.disabled = false;
        }

        // 用包含关系 + 字面重叠度给候选，避免引入额外依赖
        function suggest(key, level, dType) {
            if (key.length < 2) return [];
            const pool = items.filter(it => (level === '全部' || it.level === level) &&
                                            (dType === '全部' || it.degreeType === dType));
            const scored = [];
            for (const it of pool) {
                const n = norm(it.name);
                let score = 0;
                if (n.includes(key) || key.includes(n)) {
                    score = 100 - Math.abs(n.length - key.length);
                } else {
                    // 至少要共用一个字，再算编辑距离相似度，避免「沙发」推荐到「发电厂」
                    if (![...key].some(ch => n.includes(ch))) continue;
                    score = levRatio(key, n) * 100;
                }
                if (score >= 40) scored.push({ name: it.name, score });
            }
            const uniq = [];
            const seen = new Set();
            scored.sort((a, b) => b.score - a.score);
            for (const s of scored) {
                if (seen.has(s.name)) continue;
                seen.add(s.name);
                uniq.push(s.name);
                if (uniq.length >= 6) break;
            }
            return uniq;
        }

        function levRatio(a, b) {
            const m = a.length, n = b.length;
            if (!m || !n) return 0;
            let prev = Array.from({ length: n + 1 }, (_, j) => j);
            for (let i = 1; i <= m; i++) {
                const cur = [i];
                for (let j = 1; j <= n; j++) {
                    cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
                }
                prev = cur;
            }
            return 1 - prev[n] / Math.max(m, n);
        }

        function quickSearch(name) {
            majorInput.value = name;
            search();
        }

        function hl(text, kw) {
            if (!kw) return text;
            const i = text.indexOf(kw);
            if (i === -1) return text;
            return text.slice(0, i) + '<span style="color:#1677FF;font-weight:500;">' + kw + '</span>' + text.slice(i + kw.length);
        }

        function clearForm() {
            majorInput.value = '';
            degreeSelect.value = '全部';
            renderChips();
            resultSection.classList.remove('show');
            majorInput.focus();
        }

        window.addEventListener('load', async () => {
            renderChips();
            majorInput.focus();
            try { await loadData(); } catch (e) { console.error(e); }
        });
    </script>
</body>
</html>
