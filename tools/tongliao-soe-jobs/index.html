<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通辽央国企招录岗位查询系统</title>
<style>
:root{
  --primary:#0089FF; --primary-dark:#0074D9; --primary-light:#E8F4FF;
  --bg:#F5F9FF; --card:#FFFFFF; --text:#2B2B2B; --muted:#8A8A8A;
  --line:#DFEAF5; --green:#18A058; --blue:#2F6BFF; --gold:#F5A623;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;}
.container{max-width:1080px;margin:0 auto;padding:24px 20px 60px;}
/* 头部 */
.hero{background:linear-gradient(135deg,#4DA6FF 0%,#0089FF 55%,#0066CC 100%);
  border-radius:20px;padding:32px 28px;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 8px 28px rgba(0,137,255,.28);}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;
  background:rgba(255,255,255,.12);border-radius:50%;}
.hero h1{font-size:26px;font-weight:700;letter-spacing:.5px;}
.hero .sub{margin-top:8px;font-size:14px;opacity:.95;}
.hero .stats{margin-top:18px;display:flex;flex-wrap:wrap;gap:12px;}
.hero .stat{background:rgba(255,255,255,.18);border-radius:12px;padding:10px 16px;
  backdrop-filter:blur(4px);}
.hero .stat b{font-size:20px;display:block;}
.hero .stat span{font-size:12px;opacity:.9;}
/* 筛选区 */
.filter-card{background:var(--card);border-radius:16px;padding:22px;margin-top:20px;
  box-shadow:0 2px 12px rgba(0,0,0,.05);border:1px solid var(--line);}
.filter-card h2{font-size:16px;color:var(--primary);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.filter-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:13px;color:var(--muted);font-weight:600;}
.field select,.field input{height:44px;border:1.5px solid var(--line);border-radius:10px;
  padding:0 14px;font-size:15px;color:var(--text);background:#fff;outline:none;transition:.2s;}
.field select{min-width:180px;cursor:pointer;}
.field input{min-width:300px;}
.field select:focus,.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
.btn{height:44px;padding:0 24px;border:none;border-radius:10px;font-size:15px;font-weight:600;
  cursor:pointer;transition:.2s;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,137,255,.35);}
.btn-ghost{background:#fff;color:var(--muted);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
.hint{font-size:12px;color:var(--muted);margin-top:10px;}
/* 结果区 */
.result-bar{margin-top:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.result-bar .count{font-size:15px;font-weight:600;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.tag-exact{background:#E6F7EE;color:var(--green);}
.tag-cat{background:#EAF2FF;color:var(--blue);}
.tag-near{background:#FFF6E5;color:var(--gold);}
.tag-any{background:#F2F2F2;color:var(--muted);}
/* 岗位卡片 */
.job-group{margin-top:18px;}
.job-group h3{font-size:15px;margin-bottom:10px;color:var(--text);}
.job-card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px 20px;margin-bottom:12px;transition:.2s;position:relative;}
.job-card:hover{box-shadow:0 4px 16px rgba(0,137,255,.12);border-color:var(--primary);transform:translateY(-2px);}
.job-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.job-unit{font-size:15px;font-weight:700;color:var(--text);}
.job-post{font-size:17px;font-weight:700;color:var(--primary);margin-top:2px;}
.job-num{background:var(--primary-light);color:var(--primary);border-radius:8px;padding:4px 12px;
  font-size:13px;font-weight:700;white-space:nowrap;}
.job-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.job-tag{background:#F7F7F7;border-radius:6px;padding:3px 10px;font-size:12px;color:#555;}
.job-major{margin-top:10px;font-size:13px;color:#555;background:#F0F8FF;border-radius:8px;
  padding:10px 12px;border-left:3px solid var(--primary);}
.job-major mark{background:#D6EBFF;color:#005CB8;padding:0 3px;border-radius:3px;font-weight:600;}
.job-foot{margin-top:10px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.job-foot a{color:var(--blue);text-decoration:none;}
.job-foot a:hover{text-decoration:underline;}
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .ico{font-size:40px;}
/* 招录单位弹窗 */
.modal-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
  align-items:flex-start;justify-content:center;padding:60px 16px;}
.modal-mask.show{display:flex;}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:75vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.2);}
.modal-head{display:flex;justify-content:space-between;align-items:center;
  padding:16px 20px;border-bottom:1px solid var(--line);flex-shrink:0;}
.modal-head b{font-size:16px;color:var(--text);}
.modal-close{border:none;background:#F2F2F2;width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;color:var(--muted);}
.modal-close:hover{background:#E5E5E5;}
.modal-body{overflow-y:auto;padding:6px 14px 18px;}
.unit-item{border:1px solid var(--line);border-radius:10px;margin-top:8px;overflow:hidden;}
.unit-row{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:10px 14px;cursor:pointer;}
.unit-row:hover{background:#F5F9FF;}
.unit-row .uname{font-size:14px;font-weight:600;color:var(--text);}
.unit-row .umeta{font-size:12px;color:var(--muted);white-space:nowrap;}
.unit-jobs{display:none;border-top:1px solid var(--line);background:#FAFCFF;padding:6px 14px;}
.unit-item.open .unit-jobs{display:block;}
.unit-job{display:flex;justify-content:space-between;gap:10px;font-size:13px;
  color:#555;padding:5px 0;border-bottom:1px dashed #EEF3FA;}
.unit-job:last-child{border-bottom:none;}
.unit-job .jp{color:var(--primary);font-weight:600;}
/* 响应式 */
@media(max-width:640px){
  .field input{min-width:100%;}
  .field{width:100%;}
  .field select{width:100%;}
  .hero h1{font-size:22px;}
}
</style>
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>🔎 通辽央国企招录岗位查询系统</h1>
    <div class="sub">收录通辽市属国企 + 央国企驻通辽机构公开招聘岗位 · 支持学历 / 年份 / 专业 / 公告关键字多条件筛选</div>
    <div class="stats" id="heroStats"></div>
  </div>

  <div class="filter-card">
    <h2>⚙️ 筛选条件</h2>
    <div class="filter-row">
      <div class="field">
        <label>你的最高学历</label>
        <select id="eduSel">
          <option value="0">不限</option>
          <option value="1">专科（大专）</option>
          <option value="2" selected>本科</option>
          <option value="3">硕士（研究生）</option>
          <option value="4">博士</option>
        </select>
      </div>
      <div class="field">
        <label>招录年份</label>
        <select id="yearSel">
          <option value="all" selected>全部</option>
          <option value="2024">2024 年</option>
          <option value="2025">2025 年</option>
          <option value="2026">2026 年</option>
        </select>
      </div>
      <div class="field">
        <label>你的专业（可输关键词，如「会计」「计算机」）</label>
        <input id="majorInput" placeholder="例如：会计学、计算机科学与技术、土木工程…">
      </div>
      <div class="field">
        <label>公告关键字（按单位 / 岗位 / 公告名搜索）</label>
        <input id="keywordInput" placeholder="例如：铁路、烟草、银行、客服经理…">
      </div>
      <button class="btn btn-primary" onclick="doQuery()">查 询</button>
      <button class="btn btn-ghost" onclick="resetQuery()">重 置</button>
    </div>
    <div class="hint">💡 匹配规则：<b>精确匹配</b>（岗位专业含你输入的专业名）＞ <b>大类匹配</b>（你的专业所属大类被岗位要求，依据教育部专业目录）＞ <b>不限专业</b>（岗位不限专业）。为稳妥起见，专业没写进岗位要求的一律不列为可报，避免报名审核不通过。留空专业则按学历、年份、关键字筛选。</div>
  </div>

  <div class="result-bar" id="resultBar" style="display:none;">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <div class="count" id="resultCount"></div>
      <button class="btn btn-ghost" style="height:32px;padding:0 14px;font-size:13px;" onclick="openUnitsModal()">🏢 招录单位</button>
      <button class="btn btn-ghost" style="height:32px;padding:0 14px;font-size:13px;" onclick="exportJobs()">⬇️ 导出</button>
    </div>
    <div class="legend" id="matchLegend">
      <span><span class="tag tag-exact">精确匹配</span></span>
      <span><span class="tag tag-cat">大类匹配</span></span>
      <span><span class="tag tag-any">不限专业</span></span>
    </div>
  </div>

  <div id="resultArea"></div>
  <div id="emptyState" class="empty" style="display:none;">
    <div class="ico">🔍</div>
    <p>没有找到符合条件的岗位，试试降低学历要求或换个专业关键词。</p>
  </div>

  <div class="modal-mask" id="unitsModal" onclick="if(event.target===this)this.classList.remove('show')">
    <div class="modal">
      <div class="modal-head"><b id="unitsTitle"></b><button class="modal-close" onclick="document.getElementById('unitsModal').classList.remove('show')">✕</button></div>
      <div class="modal-body" id="unitsBody"></div>
    </div>
  </div>
</div>

// 从岗位专业文本提取专业名列表（去代码/前缀）
function extractMajorNames(text){
  if(!text) return [];
  let t = text.replace(/(本科|研究生|专科|大专|大学本科|硕士研究生|大学专科)[：:]/g,' ');
  let names = [];
  for(let seg of t.split(/[、，,；;／\/\s]+/)){
    seg = seg.trim();
    if(!seg) continue;
    seg = seg.replace(/[（(].*?[）)]/g,'');
    seg = seg.replace(/[0-9][0-9TtKkJj]*$/,'');
    seg = seg.replace(/[0-9TtKkJj 、，,]+$/g,'');
    if(seg.length>=2) names.push(seg);
  }
  return names;
}

// 匹配等级：'exact' | 'cat' | 'any' | 'none'
function matchMajor(userMajor, jobMajorText){
  const jt = jobMajorText || '';
  if(!userMajor){ // 未输专业：只按学历，视为不限
    return {level:'any', hit:''};
  }
  if(jt.includes('不限') || jt.trim()===''){
    return {level:'any', hit:'不限'};
  }
  const u = userMajor.trim();
  // 1. 精确：岗位专业文本含完整输入
  if(jt.includes(u)){
    return {level:'exact', hit:u};
  }
  // 2. 大类：用户专业所属大类出现在岗位要求里（依据教育部专业目录）
  const cats = MAJOR_CAT[u] || [];
  for(const c of cats){
    if(jt.includes(c)){
      return {level:'cat', hit:c};
    }
  }
  // 未精确命中、也未命中大类 → 视为不可报（报名审核不通过，宁缺毋滥）
  return {level:'none', hit:''};
}

function doQuery(){
  const eduLevel = parseInt(document.getElementById('eduSel').value);
  const yearSel = document.getElementById('yearSel').value;
  const major = document.getElementById('majorInput').value.trim();
  const keyword = document.getElementById('keywordInput').value.trim();

  const results = [];
  for(const job of JOBS){
    // 学历筛选：用户学历层级 >= 岗位最低学历层级
    if(job.edu_level > eduLevel) continue;
    // 年份筛选
    if(yearSel !== 'all'){
      const ys = String(job.year||'').split(',');
      if(!ys.includes(yearSel)) continue;
    }
    // 公告关键字：匹配单位 + 岗位 + 公告名
    if(keyword){
      const hay = (job.source||'') + ' ' + (job.unit||'') + ' ' + (job.post||'');
      if(!hay.includes(keyword)) continue;
    }
    const m = matchMajor(major, job.major);
    if(m.level === 'none') continue;  // 过滤专业不匹配的岗位
    results.push({job, ...m});
  }

  // 排序：exact > cat > near > any；同等级按发布日期降序
  const order = {exact:0, cat:1, any:2};
  results.sort((a,b)=>{
    if(order[a.level]!==order[b.level]) return order[a.level]-order[b.level];
    return (b.job.date||'').localeCompare(a.job.date||'');
  });

  // 构造筛选条件描述
  const conds = [];
  if(yearSel !== 'all') conds.push(yearSel + ' 年');
  if(keyword) conds.push('关键词「' + keyword + '」');
  if(major) conds.push('专业「' + major + '」');

  render(results, conds.join(' · '), !!major);
}

          (hasMajor?'<span class="'+grp.cls+'">'+grp.title.replace(/[✅📚🔗🌐📋]\s*/,'')+'</span>':'')+
        '</div>'+
        '<div class="job-major">📖 '+majorHtml+'</div>'+
        '<div class="job-foot">'+
          '<span>'+escapeHtml(j.source)+' · '+escapeHtml(j.date)+'</span>'+
          '<a href="'+escapeHtml(j.url)+'" target="_blank">查看原公告 ↗</a>'+
        '</div>'+
      '</div>';
    }
    html += '</div>';
  }
  area.innerHTML = html;
}

function resetQuery(){
  document.getElementById('eduSel').value='2';
  document.getElementById('yearSel').value='all';
  document.getElementById('majorInput').value='';
  document.getElementById('keywordInput').value='';
  doQuery();
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeRegExp(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

// 招录单位弹窗：展示本次筛选结果的全部单位（点击行展开岗位明细）
function openUnitsModal(){
  const map = new Map();
  for(const r of lastResults){
    const j = r.job;
    if(!map.has(j.unit)) map.set(j.unit, []);
    map.get(j.unit).push(j);
  }
  const units = Array.from(map.entries()).sort((a,b)=>b[1].length-a[1].length);
  document.getElementById('unitsTitle').innerText = '此次筛选的招录单位（'+units.length+' 家）';
  let html = '';
  for(const [u, jobs] of units){
    let people = 0;
    jobs.forEach(j=>{ const m=String(j.num||'').match(/\d+/); if(m) people+=parseInt(m[0]); });
    const meta = jobs.length+' 个岗位'+(people?' · 招 '+people+' 人':'');
    html += '<div class="unit-item">'+
      '<div class="unit-row"><span class="uname">'+escapeHtml(u)+'</span>'+
      '<span class="umeta">'+meta+' ▾</span></div>'+
      '<div class="unit-jobs">'+jobs.map(j=>
        '<div class="unit-job"><span class="jp">'+escapeHtml(j.post)+'</span>'+
        '<span>'+(j.num?('招 '+escapeHtml(j.num)+' 人'):'名额若干')+'</span></div>'
      ).join('')+'</div>'+
    '</div>';
  }
  document.getElementById('unitsBody').innerHTML = html;
  document.getElementById('unitsModal').classList.add('show');
}
document.getElementById('unitsBody').addEventListener('click', function(e){
  const item = e.target.closest('.unit-item');
  if(item) item.classList.toggle('open');
});

// 导出当前筛选结果岗位表为 CSV（UTF-8 BOM，Excel 可直接打开）
function exportJobs(){
  if(!lastResults.length){ alert('当前没有可导出的岗位'); return; }
  const header = ['招录单位','招聘岗位','招聘人数','学历','专业要求','工作地点','所属公告','发布日期','原文链接'];
  const rows = lastResults.map(r => {
    const j = r.job;
    return [j.unit, j.post, (j.num||'名额若干'), (j.edu||''), (j.major||''),
            (j.location||''), (j.source||''), (j.date||''), (j.url||'')];
  });
  const csv = [header, ...rows].map(row =>
    row.map(cell => {
      const s = String(cell==null?'':cell);
      if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
      return s;
    }).join(',')
  ).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '通辽央国企岗位_筛选结果.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

// 初始加载：按本科 + 不限专业展示全部可报岗位
doQuery();
